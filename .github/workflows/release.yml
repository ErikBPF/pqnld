name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl --manifest-path sidecar-rs/Cargo.toml
      - name: Stage asset
        run: cp sidecar-rs/target/x86_64-unknown-linux-musl/release/pqnld-rs pqnld-rs-x86_64-unknown-linux-musl
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: pqnld-rs-x86_64-unknown-linux-musl
          generate_release_notes: true
