name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path sidecar-rs/Cargo.toml
      - name: Tests (no GPU, no network)
        run: cargo test --release --manifest-path sidecar-rs/Cargo.toml
