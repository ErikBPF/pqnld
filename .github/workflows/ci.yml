name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests (core + tester, no GPU)
        run: python -m unittest discover -s tests -v
      - name: Benchmark self-tests (no GPU)
        run: |
          python benchmarks/bench_parallel.py --selftest
          python benchmarks/bench_mixed.py --selftest
      - name: Byte-compile
        run: python -m compileall -q src benchmarks

  core-stdlib-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The core must import with no third-party packages installed
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import pqnld.decision as d; print('core ok', d.ModelSpec().readout)"
