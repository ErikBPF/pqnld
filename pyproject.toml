[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pqnld"
version = "0.1.0"
description = "Turn any vLLM/OpenAI endpoint into a typed decision engine by reading answer-slot logprobs."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Erik Bogado" }]
keywords = ["vllm", "logprobs", "decision", "llm", "calibration", "decision-index"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
tester = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pydantic>=2"]
dev = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pydantic>=2", "build>=1.2"]

[project.scripts]
pqnld = "pqnld.decision:main"
pqnld-tester = "pqnld.tester:main"

[project.urls]
Homepage = "https://github.com/ErikBPF/pqnld"
Issues = "https://github.com/ErikBPF/pqnld/issues"
Source = "https://github.com/ErikBPF/pqnld"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pqnld = ["models/*.json"]
